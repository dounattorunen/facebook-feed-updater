name: FTP debug (temporary)
on: workflow_dispatch
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04]
        mode: [default, no-epsv]
    runs-on: ${{ matrix.os }}
    steps:
      - name: FTP connect test
        run: |
          . /etc/os-release; echo "::notice::${{ matrix.os }}/${{ matrix.mode }} -> $PRETTY_NAME, $(curl --version | head -1)"
          echo "::notice::runner IP $(curl -s https://api.ipify.org)"
          EXTRA=""; [ "${{ matrix.mode }}" = "no-epsv" ] && EXTRA="--disable-epsv"
          set +e
          curl -v --connect-timeout 30 --max-time 60 $EXTRA --list-only "ftp://${{ secrets.FTP_SERVER }}/public_html/pinterest/" --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" > out.txt 2> err.txt
          rc=$?
          echo "::notice::${{ matrix.os }}/${{ matrix.mode }} exit=$rc"
          grep -vi -e 'PASS ' -e 'USER ' err.txt | tail -25 | while IFS= read -r l; do echo "::warning::$l"; done
          exit $rc
